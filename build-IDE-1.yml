name: Build CodeInjector IDE

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The workflow supports the user's phone workflow: upload the project ZIP
      # as a repository file, then upload this build.yml under .github/workflows/.
      - name: Extract uploaded project ZIP if needed
        shell: bash
        run: |
          if [[ ! -f settings.gradle.kts ]]; then
            shopt -s nullglob
            zips=( *.zip )
            if (( ${#zips[@]} == 0 )); then
              echo "No settings.gradle.kts and no project ZIP found at repository root." >&2
              exit 1
            fi
            echo "Extracting ${zips[0]}..."
            unzip -o "${zips[0]}" -d . -x '.github/workflows/*'
          fi
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeInjector-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
